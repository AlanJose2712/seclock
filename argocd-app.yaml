apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seclock
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlanJose2712/seclock.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: seclock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
